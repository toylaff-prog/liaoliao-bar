<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>聊聊BAR 3D 示意模型</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#365f86">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#dfe8f0; --panel:rgba(250,252,254,.9); --ink:#1f2a36; --muted:#56667a; --line:rgba(31,42,54,.16);
  --accent:#365f86; --accent-ink:#ffffff; --chip:#ffffff; --chip-ink:#1f2a36;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f161e; --panel:rgba(22,31,41,.9); --ink:#e8eef5; --muted:#9fb0c3; --line:rgba(232,238,245,.18);
    --accent:#9cc3e6; --accent-ink:#0e1620; --chip:#1d2a38; --chip-ink:#e8eef5; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f161e; --panel:rgba(22,31,41,.9); --ink:#e8eef5; --muted:#9fb0c3; --line:rgba(232,238,245,.18);
  --accent:#9cc3e6; --accent-ink:#0e1620; --chip:#1d2a38; --chip-ink:#e8eef5; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;overflow:hidden}
#app{position:relative;height:100%;width:100%}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.bar{position:absolute;left:0;right:0;padding:10px 12px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.bar > *{pointer-events:auto}
.top{top:0}
.bottom{bottom:0}
.titlebox{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.titlebox h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.04em}
.titlebox p{margin:2px 0 0;font-size:12px;color:var(--muted);line-height:1.5}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--chip);
  color:var(--chip-ink);font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.panel{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:5px 8px;overflow-x:auto;max-width:100%;scrollbar-width:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.panel::-webkit-scrollbar{display:none}
.panel[hidden],.gamecard[hidden]{display:none}
.panel .gt{font-size:13px;font-weight:700;white-space:nowrap;flex:0 0 auto}
.panel .st{font-size:13px;white-space:nowrap;flex:0 0 auto;color:var(--ink)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.roombox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,440px);max-height:78%;overflow:auto;
  background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:16px 18px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.roombox[hidden]{display:none}
.roombox .qr{display:block;width:160px;height:160px;margin:8px auto;border-radius:8px;image-rendering:pixelated;background:#fff}
.loading{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);color:var(--ink);font-size:15px;transition:opacity .4s}
.loading.done{opacity:0;pointer-events:none}
.spinner{width:38px;height:38px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation-duration:3s}}
.roombox h2{margin:0 0 6px;font-size:17px}
.roombox p{margin:6px 0;font-size:13px;line-height:1.6;color:var(--muted)}
.roombox .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.roombox input[type=text],.roombox input[type=password]{min-height:40px;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--chip-ink);padding:0 10px;font:inherit;font-size:15px;min-width:0}
.roombox .code{font-size:36px;font-weight:800;letter-spacing:.22em;color:var(--accent);margin:2px 0 4px}
.roombox .seats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chip.seatb{min-width:0;padding:0 6px;border-bottom-width:4px;overflow:hidden;text-overflow:ellipsis}
.chip.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.score{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink);padding:2px 8px;
  border-radius:12px;border:1px solid var(--line);background:var(--chip)}
.score i{width:9px;height:9px;border-radius:50%;display:inline-block}
.meter{position:relative;flex:0 0 150px;height:24px;border-radius:12px;background:var(--chip);border:1px solid var(--line);overflow:hidden}
.meter .zone{position:absolute;top:0;bottom:0;left:41%;width:18%;background:rgba(60,170,100,.5)}
.meter .mk{position:absolute;top:3px;bottom:3px;width:7px;margin-left:-3px;border-radius:4px;background:var(--accent)}
.gamecard{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(84vw,400px);background:var(--panel);
  color:var(--ink);border:3px solid var(--line);border-radius:16px;padding:16px 18px;text-align:center;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.gamecard .ct{font-size:13px;color:var(--muted);margin-bottom:6px}
.gamecard .tx{font-size:20px;line-height:1.55;font-weight:600}
.panel .tag{font-size:12px;color:var(--muted);white-space:nowrap;flex:0 0 auto}
.panel input{flex:0 0 auto;min-height:36px;width:7.5em;border-radius:8px;border:1px solid var(--line);background:var(--chip);
  color:var(--chip-ink);padding:0 10px;font:inherit;font-size:14px}
.panel input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.chip.sm{min-height:36px;padding:0 12px;font-size:13px}
.chip.num{min-width:36px;padding:0 8px;border-bottom-width:4px}
.toast{position:absolute;left:50%;top:128px;transform:translateX(-50%);max-width:min(86vw,420px);text-align:center;
  background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:16px;
  line-height:1.5;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
@media (max-height:780px){.note{display:none}}
.note{align-self:flex-start;max-width:min(560px,100%);margin:0;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:7px 11px;font-size:12px;line-height:1.55;color:var(--muted);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
@media (max-width:520px){ .titlebox p{display:none} }
</style>
</head>
<body>
<div id="app">
  <div class="loading" id="loading" role="status"><div class="spinner"></div><div>聊聊BAR 載入中…</div></div>
  <div id="stage"></div>
  <div class="bar top">
    <div class="titlebox"><h1>聊聊BAR 3D 示意模型</h1><p>拖曳旋轉、雙指或滾輪縮放、右鍵／雙指拖曳平移</p></div>
    <div class="chips" id="views" role="group" aria-label="視角"></div>
  </div>
  <div class="bar bottom">
    <div class="chips" id="scenes" role="group" aria-label="場景與遊戲"></div>
    <div class="panel" id="game" role="group" aria-label="遊戲" hidden></div>
    <div class="panel" id="panel" role="group" aria-label="人物與家具"></div>
    <div class="chips" id="toggles" role="group" aria-label="顯示選項"></div>
    <p class="note">場地依 5 張照片估算尺寸與擺位；人物是依照片衣著髮型做的 Q 版示意造型。</p>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="gamecard" id="gcard" role="status" hidden></div>
  <div class="roombox" id="room" role="dialog" aria-label="多人房間" hidden></div>
</div>

<script src="config.js"></script>
<script src="lib/peerjs.min.js"></script>
<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script src="lib/qrcode.js"></script>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
</html>
